<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Poster Forge — GTA 6-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <aside class="side">
  <header class="brand">
    <h1>VICE POSTER FORGE</h1>
    <p class="tag">Turn a photo and a caption into GTA 6-style cover art. Offline. Nothing leaves your machine.</p>
  </header>
  <section class="controls">
    <label class="field">Photos <input id="photos" type="file" accept="image/*" multiple></label>
    <label class="field">Layout
      <select id="layout">
        <option value="hero3">Hero + 3 panels</option>
        <option value="grid4">Four panels</option>
        <option value="twin">Twin panels</option>
        <option value="solo">Single panel</option>
      </select>
    </label>
    <label class="field">Grade
      <select id="grade">
        <option value="sunset">Vice Sunset</option>
        <option value="neon">Neon Night</option>
        <option value="pastel">Miami Pastel</option>
        <option value="heist">Heist Gold</option>
      </select>
    </label>
    <label class="field">Caption <input id="caption" type="text" maxlength="48" value="SUNSET HEIST"></label>
    <label class="field">Badge <input id="badge" type="text" maxlength="20" value="VICE EDITION"></label>
    <div class="field sizes" id="sizes">
      <button class="size" data-w="1080" data-h="1080">1080×1080</button>
      <button class="size" data-w="1080" data-h="1350">1080×1350</button>
      <button class="size" data-w="1920" data-h="1080">1920×1080</button>
    </div>
    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  </aside>
  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="Cover preview"></canvas>
  </section>
</main>
<script>window.onerror = (m, s, l) => { document.title = 'ERR ' + m + ' @' + (s||'').split('/').pop() + ':' + l; };</script>
<script type="module" src="./src/shots.js"></script>
</body>
</html>
